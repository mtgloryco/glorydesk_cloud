services:
  glorydesk-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glorydesk-cloud
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret}@db:5432/${POSTGRES_DB:-glorydesk_cloud}
      - Jwt__Key=${Jwt__Key:-IMS-Cloud-Dev-Secret-Key-Change-In-Production-32chars!}
      - Jwt__Issuer=${Jwt__Issuer:-glorydesk-web}
      - Jwt__Audience=${Jwt__Audience:-glorydesk-clients}
      - Admin__ApiKey=${Admin__ApiKey:-change-me-in-production}
      - Admin__AlertEmail=${Admin__AlertEmail:-support@mtglory.com}
      - License__PrivateKeyBase64=${License__PrivateKeyBase64:-}
      - BackupStoragePath=/app/backups
      - Smtp__Host=${Smtp__Host:-}
      - Smtp__Port=${Smtp__Port:-587}
      - Smtp__User=${Smtp__User:-}
      - Smtp__Password=${Smtp__Password:-}
      - Smtp__From=${Smtp__From:-noreply@mtglory.com}
      - Smtp__EnableSsl=${Smtp__EnableSsl:-true}
    volumes:
      - backups_data:/app/backups
    networks:
      default:
        aliases:
          - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: glorydesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: ${POSTGRES_DB:-glorydesk_cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backups_data:
